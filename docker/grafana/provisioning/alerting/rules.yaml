apiVersion: 1

groups:
  - orgId: 1
    name: infra-container-state
    folder: Infra Alerts
    interval: 1m
    rules:
      - uid: container-down
        title: Container down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "One or more always-on Docker containers on the host are not running or are missing (see the allowlist query in Grafana for which)."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: clickhouse
            model:
              refId: A
              rawQuery: true
              format: table
              rawSql: |
                -- Allowlist: the always-on services. Anything else on the host (test stacks,
                -- one-shot init jobs, debug-profile tools) is ignored. When a permanent
                -- container is added, renamed or retired, update this list in the same change.
                SELECT count() AS down_count
                FROM (
                  SELECT arrayJoin([
                    'akvorado-akvorado-conntrack-fixer-1', 'akvorado-akvorado-console-1',
                    'akvorado-akvorado-inlet-1', 'akvorado-akvorado-orchestrator-1',
                    'akvorado-akvorado-outlet-1', 'akvorado-clickhouse-1',
                    'akvorado-docker-socket-proxy-1', 'akvorado-geoip-1', 'akvorado-grafana-1',
                    'akvorado-kafka-1', 'akvorado-kafka-ui-1', 'akvorado-otel-collector-1',
                    'akvorado-redis-1', 'akvorado-telegraf-1', 'akvorado-traefik-1',
                    'freepbx-docker-db-1', 'freepbx-docker-freepbx-1',
                    'hitpacific-caddy-proxy',
                    'postiz', 'postiz-postgres', 'postiz-redis',
                    'temporal', 'temporal-elasticsearch', 'temporal-postgresql'
                  ]) AS container_name
                ) AS expected
                LEFT JOIN (
                  SELECT container_name,
                         argMax(container_status, time) AS status,
                         max(time) AS last_seen
                  FROM docker_container_status
                  WHERE time > now() - INTERVAL 10 MINUTE
                  GROUP BY container_name
                ) AS seen USING (container_name)
                -- down = not running, or absent from recent Telegraf scrapes. A scrape is spread
                -- over ~2 s: exited containers are stamped :00, running ones :01-:02 after their
                -- stats call, and the :00 flush lands between them, so max(time) can run ~59 s
                -- ahead of a healthy container. 90 s (> one 60 s interval) tolerates that and still
                -- flags a container missing from two scrapes. A missing row comes back as
                -- status '' / last_seen 1970, so a removed container counts too; the 2m `for:`
                -- absorbs a compose recreate.
                WHERE seen.status != 'running'
                   OR seen.last_seen < (SELECT max(time) FROM docker_container_status
                                        WHERE time > now() - INTERVAL 10 MINUTE) - INTERVAL 90 SECOND
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Alerting
